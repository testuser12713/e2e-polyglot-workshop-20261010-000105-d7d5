[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-invoice-worker"
version = "0.1.0"
description = "Invoice worker of the Kfz workshop portal: consumes completed orders from Valkey and writes invoices to PostgreSQL."
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.29,<1",
    "redis>=5,<6",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = []
py-modules = []
